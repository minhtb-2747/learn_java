# JPA / Hibernate (prod) - validate: không cho Hibernate tự sửa schema production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Giảm bớt log
logging.level.root=WARN
logging.level.com.socialanalytics=INFO

# Xoay vòng file log: mỗi file tối đa 10MB, giữ 30 ngày, tổng tối đa 1GB
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# Actuator - ẩn chi tiết health
management.endpoint.health.show-details=never
