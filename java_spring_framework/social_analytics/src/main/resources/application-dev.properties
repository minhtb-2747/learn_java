# JPA / Hibernate (dev) - update tự động tạo/sửa bảng theo entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Log chi tiết
# Log SQL qua logger thay vì show-sql (show-sql in thẳng ra stdout, không qua logback)
logging.level.org.hibernate.SQL=DEBUG
# Giá trị tham số bind vào câu SQL (?)
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.socialanalytics=DEBUG

# Actuator - hiện chi tiết health (DB, disk...)
management.endpoint.health.show-details=always
