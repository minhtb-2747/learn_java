spring.application.name=social_analytics

# Không mặc định dev: deploy quên đặt biến thì không vô tình chạy cấu hình dev (ddl-auto=update, log SQL...)
# Local lấy SPRING_PROFILES_ACTIVE=dev từ .env
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# Nạp file .env nếu có (không có file vẫn chạy bình thường)
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# DataSource (MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:social_analytics}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
# Mặc định validate (an toàn); profile dev ghi đè thành update
spring.jpa.hibernate.ddl-auto=validate
# Tắt OSIV: không giữ connection DB suốt request, map entity -> DTO trong @Transactional của service
spring.jpa.open-in-view=false

# Timezone - lưu và trả thời điểm theo UTC, không phụ thuộc timezone của máy chạy app
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

# Actuator - chỉ mở health và metrics
management.endpoints.web.exposure.include=health,metrics

# Logging - file log (chỉ ghi khi bật file appender ở profile prod, xem logback-spring.xml)
logging.file.name=${LOG_PATH:logs}/social_analytics.log
