spring.application.name=social_analytics

# Không mặc định dev để deploy quên đặt biến không chạy nhầm cấu hình dev; local lấy từ .env
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# Nạp file .env nếu có
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# DataSource (MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:social_analytics}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=30000

# JPA - schema do Flyway quản lý, Hibernate chỉ kiểm tra
spring.jpa.hibernate.ddl-auto=validate
# Tắt OSIV: map entity -> DTO trong @Transactional của service
spring.jpa.open-in-view=false

# Lưu và trả thời gian theo UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

# Flyway
spring.flyway.locations=classpath:db/migration

# Actuator - chỉ mở health và metrics
management.endpoints.web.exposure.include=health,metrics

# File log (chỉ ghi ở profile prod, xem logback-spring.xml)
logging.file.name=${LOG_PATH:logs}/social_analytics.log
